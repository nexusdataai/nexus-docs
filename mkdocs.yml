site_name: NexusAI Data Platform
site_description: Comprehensive documentation for the NexusAI Data Platform - The Intelligent AI Operating Layer for the Enterprise
site_author: NexusAI

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/nexus-logo-white.svg
  favicon: assets/nexus-logo-white.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - toc.follow
    - content.code.copy

extra_css:
  - stylesheets/extra.css
  - stylesheets/pdf.css

extra_javascript:
  - javascripts/sidebar-toggle.js
  - javascripts/pdf-download.js

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
  - pdf-export:
      verbose: false
      combined: false
      enabled_if_env: ENABLE_PDF_EXPORT
  - with-pdf:
      enabled_if_env: ENABLE_PDF_EXPORT
      output_path: nexus-data-platform.pdf
      author: NexusAI
      copyright: "Copyright (c) NexusAI Data Platform"
      cover: true
      cover_title: NexusAI Data Platform
      cover_subtitle: Comprehensive Documentation
      cover_logo: assets/nexus-logo-white.svg
      toc_title: Table of Contents
      toc_level: 3
      ordered_chapter_level: 2
      heading_shift: false
      custom_template_path: overrides/pdf
      render_js: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

