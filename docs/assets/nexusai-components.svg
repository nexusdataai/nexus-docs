<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="psTitle psDesc">
  <title id="psTitle">NexusAI Platform Architecture</title>
  <desc id="psDesc">Six-layer intelligence architecture stacked from Foundation (Enterprise Systems) at the bottom up to Applications (Business Capabilities). Right sidebar shows AI Stack pillars (Zero Replace, Real-Time, Any Source, Human First), Monitoring and Observability, and How It Works steps (Connect, Map, Reason, Execute).</desc>

  <defs>
    <linearGradient id="psBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d24"/>
      <stop offset="55%" stop-color="#11103a"/>
      <stop offset="100%" stop-color="#1c1346"/>
    </linearGradient>
    <linearGradient id="psInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1130"/>
      <stop offset="100%" stop-color="#181244"/>
    </linearGradient>
    <linearGradient id="psTitleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3ee5ff"/>
      <stop offset="100%" stop-color="#6aa7ff"/>
    </linearGradient>
    <linearGradient id="psLayer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2249" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#13193b" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="psSidebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1c4a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f1238" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="psShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer background -->
  <rect width="1600" height="940" fill="url(#psBg)"/>
  <rect x="30" y="30" width="1540" height="880" rx="20" fill="url(#psInner)" stroke="#2a2660" stroke-width="1"/>

  <!-- Title block -->
  <text x="800" y="100" text-anchor="middle" font-size="34" font-weight="700" fill="url(#psTitleGrad)">NexusAI &#8212; Platform Architecture</text>
  <text x="800" y="128" text-anchor="middle" font-size="13" fill="#8794b8">A layered intelligence architecture that sits on top of your existing systems &#8212; no rip-and-replace required</text>

